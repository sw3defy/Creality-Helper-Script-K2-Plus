name: Safety regression checks
on:
  pull_request:
  push:
    branches:
      - maintenance/2026-11-safe-update-audit
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and safety invariants
        run: python3 tests/test_safety.py
      - name: Offline Moonraker migration scenarios
        run: python3 tests/test_moonraker_migration.py tests/test_web_ui_camera.py
      - name: Camera preservation unit tests
        run: python3 tests/test_web_ui_camera.py
      - name: Python syntax
        run: python3 -m py_compile scripts/web_ui_release.py scripts/moonraker_migration_plan.py tests/test_safety.py tests/test_moonraker_migration.py
